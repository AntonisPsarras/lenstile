<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Combined relief failure probe</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import { parseGeometryDebugFixture } from "../src/geometry/geometry-debug-fixture.js";
      import { generateTileGeometry } from "../src/geometry/generate-geometry.js";
      import {
        classifyBoundaryEdges,
        findAllBadEdges,
        countDuplicateTriangles,
        plainGeometryFailureMessage,
        formatGeometryTechnicalDetails,
      } from "../src/geometry/mesh-validation.js";
      import { createRasterMapping } from "../src/geometry/raster-coords.js";
      import { resolveColorTopHeights } from "../src/geometry/relief.js";
      import { TILE_V1 } from "../src/geometry/tile-spec.js";
      import { signedVolume } from "../src/geometry/mesh-math.js";

      const out = document.getElementById("out");

      function countInconsistentWindingEdges(mesh) {
        const tris = mesh.triangles;
        /** @type {Map<string, number>} */
        const oriented = new Map();
        for (let i = 0; i < tris.length; i += 3) {
          const ids = [tris[i], tris[i + 1], tris[i + 2]];
          for (let e = 0; e < 3; e += 1) {
            const a = ids[e];
            const b = ids[(e + 1) % 3];
            const key = `${a}>${b}`;
            oriented.set(key, (oriented.get(key) || 0) + 1);
          }
        }
        let bad = 0;
        /** @type {Set<string>} */
        const seen = new Set();
        for (const [key, count] of oriented) {
          const [a, b] = key.split(">").map(Number);
          const undirected = a < b ? `${a}|${b}` : `${b}|${a}`;
          if (seen.has(undirected)) continue;
          seen.add(undirected);
          const rev = oriented.get(`${b}>${a}`) || 0;
          if (count + rev !== 2 || count > 1 || rev > 1) bad += 1;
        }
        return bad;
      }

      function localCellsAround(mapping, x, y, tops, indices, topByPal) {
        const col = Math.min(
          mapping.width - 1,
          Math.max(0, Math.floor((x - mapping.minX) / mapping.cellWidthMm + 1e-12)),
        );
        const row = Math.min(
          mapping.height - 1,
          Math.max(0, Math.floor((mapping.maxY - y) / mapping.cellHeightMm + 1e-12)),
        );
        /** @type {Array<object>} */
        const cells = [];
        for (let dr = -1; dr <= 1; dr += 1) {
          for (let dc = -1; dc <= 1; dc += 1) {
            const c = col + dc;
            const r = row + dr;
            if (c < 0 || r < 0 || c >= mapping.width || r >= mapping.height) continue;
            const pal = indices[r * mapping.width + c];
            cells.push({
              col: c,
              row: r,
              paletteIndex: pal,
              topZ: tops[r * mapping.width + c],
              assignedTop: topByPal.get(pal),
            });
          }
        }
        return { col, row, cells };
      }

      try {
        const res = await fetch("./fixtures/combined-relief-geometry-debug.json");
        const raw = await res.json();
        const fixture = parseGeometryDebugFixture(raw);
        const t0 = performance.now();
        const geo = generateTileGeometry({
          cleanedIndices: fixture.cleanedIndices,
          width: fixture.width,
          height: fixture.height,
          surfaceStyle: fixture.surfaceStyle,
          reliefStrengthId: fixture.reliefStrengthId,
          heightOrder: fixture.heightOrder,
          colorHeightLevels: fixture.colorHeightLevels,
          effectivePalette: fixture.effectivePalette,
          geometryRevision: fixture.geometryRevision,
        });
        const elapsedMs = Math.round(performance.now() - t0);

        const combined = geo.combined;
        const edge = classifyBoundaryEdges(combined);
        const dups = countDuplicateTriangles(combined);
        const winding = typeof countInconsistentWindingEdges === "function"
          ? countInconsistentWindingEdges(combined)
          : null;
        const bad = findAllBadEdges(combined, 12);

        const relief = resolveColorTopHeights({
          style: "relief",
          reliefStrengthId: fixture.reliefStrengthId,
          heightOrder: fixture.heightOrder,
          colorHeightLevels: fixture.colorHeightLevels,
          indices: fixture.cleanedIndices,
          effectivePalette: fixture.effectivePalette,
        });
        const mapping = createRasterMapping(fixture.width, fixture.height, TILE_V1);
        const tops = [];
        for (let i = 0; i < fixture.cleanedIndices.length; i += 1) {
          tops.push(relief.topHeightByPaletteIndex.get(fixture.cleanedIndices[i]));
        }

        const badDetailed = bad.map((b) => {
          const midX = (b.coordinates[0].x + b.coordinates[1].x) / 2;
          const midY = (b.coordinates[0].y + b.coordinates[1].y) / 2;
          const midZ = (b.coordinates[0].z + b.coordinates[1].z) / 2;
          return {
            ...b,
            mid: { x: midX, y: midY, z: midZ },
            local: localCellsAround(
              mapping,
              midX,
              midY,
              tops,
              fixture.cleanedIndices,
              relief.topHeightByPaletteIndex,
            ),
          };
        });

        const colorSummaries = geo.validation.colors.map((v, i) => ({
          paletteIndex: geo.colors[i].paletteIndex,
          ok: v.ok,
          boundary: v.edgeSummary?.boundaryEdges,
          nonManifold: v.edgeSummary?.nonManifoldEdges,
          reasons: v.reasons,
        }));

        const payload = {
          elapsedMs,
          ok: geo.ok,
          userMessage: geo.userMessage || plainGeometryFailureMessage(geo.reasons),
          expectedFailingObject: fixture.expectedFailingObject,
          reasons: geo.reasons,
          combined: {
            ok: geo.validation.combined.ok,
            boundaryEdges: edge.boundaryEdges,
            nonManifoldEdges: edge.nonManifoldEdges,
            manifoldEdges: edge.manifoldEdges,
            incidenceHistogram: edge.incidenceHistogram,
            duplicateTriangles: dups,
            inconsistentWindingEdges: winding,
            signedVolume: signedVolume(combined),
            bounds: geo.validation.combined.bounds,
            triangleCount: combined.triangles.length / 3,
            vertexCount: combined.positions.length / 3,
          },
          base: {
            ok: geo.validation.base.ok,
            boundary: geo.validation.base.edgeSummary?.boundaryEdges,
            nonManifold: geo.validation.base.edgeSummary?.nonManifoldEdges,
          },
          colors: colorSummaries,
          topHeights: [...relief.topHeightByPaletteIndex.entries()],
          badEdges: badDetailed,
          technical: formatGeometryTechnicalDetails({
            reasons: geo.reasons,
            validation: geo.validation,
          }),
        };
        out.textContent = "RESULT_JSON:" + JSON.stringify(payload, null, 2);
        document.title = geo.ok ? "PASS" : "FAIL";
        window.__PROBE__ = payload;
      } catch (err) {
        out.textContent = "RESULT_JSON:" + JSON.stringify({
          error: String(err && err.stack || err),
        }, null, 2);
        document.title = "ERROR";
      }
    </script>
  </body>
</html>
